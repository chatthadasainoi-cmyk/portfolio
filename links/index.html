<style>
:root{--bg:#2B3038;--bg2:#1E2228;--text:#F5F6F8;--dim:#B7BCC6;--card:#FFFFFF;--ink:#1D2026;--red:#E3173E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%) fixed;color:var(--text);font-family:Inter,system-ui,sans-serif;display:flex;justify-content:center;padding:max(40px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom))}
main{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center}
.ph{width:112px;height:112px;border-radius:50%;overflow:hidden;box-shadow:0 12px 30px -10px rgba(0,0,0,.6);animation:in .6s cubic-bezier(.2,.8,.2,1) both}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
h1{margin-top:20px;font-weight:800;font-size:30px;letter-spacing:-.01em;animation:in .6s .06s both}
.wave{display:inline-block;transform-origin:70% 70%;animation:wave 2.2s 1s ease-in-out 2}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%{transform:rotate(-8deg)}40%{transform:rotate(-4deg)}50%{transform:rotate(10deg)}}
.intro{margin-top:8px;font-weight:600;font-size:18px;line-height:1.4;text-align:center;animation:in .6s .12s both}
.intro b{color:#FF5577;font-weight:700}
.th{margin-top:4px;font-family:"IBM Plex Sans Thai",sans-serif;font-size:13.5px;color:var(--dim);animation:in .6s .16s both}
.soc{display:flex;gap:22px;margin-top:20px;animation:in .6s .2s both}
.soc a{color:var(--text);display:grid;place-items:center;width:36px;height:36px;border-radius:50%;transition:transform .2s,opacity .2s}
.soc a:hover,.soc a:focus-visible{transform:translateY(-2px) scale(1.08);outline:none}
.soc svg{width:30px;height:30px;fill:currentColor}
.links{width:100%;margin-top:30px;display:flex;flex-direction:column;gap:16px}
a.btn{display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 18px;background:var(--card);color:var(--ink);border-radius:14px;text-decoration:none;font-weight:600;font-size:16.5px;box-shadow:0 6px 18px -10px rgba(0,0,0,.5);transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s;animation:in .5s cubic-bezier(.2,.8,.2,1) both}
a.btn:nth-child(1){animation-delay:.26s}a.btn:nth-child(2){animation-delay:.32s}a.btn:nth-child(3){animation-delay:.38s}
a.btn:hover,a.btn:focus-visible{transform:translateY(-2px) scale(1.01);box-shadow:0 12px 24px -12px rgba(0,0,0,.6);outline:none}
a.btn:active{transform:scale(.98)}
a.btn .i{width:36px;height:36px;flex:none;display:grid;place-items:center}
a.btn .i svg{width:24px;height:24px;fill:currentColor}
a.btn .t{flex:1;text-align:center}
a.btn .sp{width:36px;flex:none}
a.btn.main{background:var(--red);color:#fff}
footer{margin-top:28px;font-size:12px;color:var(--dim);animation:in .6s .45s both}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
